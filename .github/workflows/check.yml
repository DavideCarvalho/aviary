name: Check

# The deploy workflow only runs on main, so a page that breaks `next build` used to be found after
# it merged — and then held every later deploy back. This builds the site on each pull request.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prebuild syncs the library docs, compiles every page as MDX and checks the /docs links.
      - name: Build static site
        run: pnpm build
